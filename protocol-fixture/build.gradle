plugins {
    id 'fabric-loom' version '1.11.8'
}

version = '0.1.0'
group = 'dev.vibrato'
base { archivesName = 'vibrato-protocol-fixture' }

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
loom {
    runs {
        server {
            server()
            runDir '../run-protocol-fixture'
            ideConfigGenerated true
        }
    }
}
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }
