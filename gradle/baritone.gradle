// Build the sibling Baritone source checkout when its sources change.
//
// -PbaritoneSource=/some/checkout overrides the default sibling checkout.
// -PbaritoneDist=/some/dir uses a prebuilt jar and skips the source build.

import java.security.MessageDigest

def baritoneDir = file((project.findProperty('baritoneSource') ?: "${rootDir}/../Baritone").toString())
def overriddenDist = project.findProperty('baritoneDist')

ext.baritoneDist = overriddenDist ? file(overriddenDist.toString()) : new File(baritoneDir, 'dist')

def run = { File dir, boolean capture, List<String> cmd, Map<String, String> environment = [:] ->
    def pb = new ProcessBuilder(cmd).directory(dir)
    pb.environment().putAll(environment)
    if (!capture) {
        pb.inheritIO()
    } else {
        pb.redirectErrorStream(true)
    }
    def process = pb.start()
    def output = capture ? process.inputStream.text : ''
    int code = process.waitFor()
    return [code: code, out: output.trim()]
}

if (!overriddenDist) {
    def jar = new File(baritoneDist, "baritone-unoptimized-fabric-${project.baritone_version}.jar")
    def stampFile = new File(baritoneDist, '.vibrato-stamp')

    if (!new File(baritoneDir, 'gradlew').isFile()) {
        throw new GradleException("Baritone source has no gradlew: ${baritoneDir}. Set -PbaritoneSource=/path/to/Baritone")
    }

    def buildBaritone = { String stamp ->
        if (!jar.exists() || !stampFile.exists() || stampFile.text.trim() != stamp) {
            logger.lifecycle('[vibrato] building baritone (first build downloads and remaps Minecraft, this takes a while)')
            def result = run(baritoneDir, false, ['./gradlew', ':fabric:build', '-Pavailable_loaders=fabric', '--console=plain'])
            if (result.code != 0 || !jar.exists()) {
                throw new GradleException("baritone build failed (exit ${result.code}); expected ${jar}")
            }
            stampFile.text = stamp
        }
    }

    def head = run(baritoneDir, true, ['git', 'rev-parse', 'HEAD'])
    if (head.code != 0) throw new GradleException("Baritone source must be a Git checkout: ${head.out}")
    def tracked = run(baritoneDir, true, ['git', 'diff', '--binary', head.out, '--'])
    if (tracked.code != 0) throw new GradleException("Cannot inspect Baritone changes: ${tracked.out}")
    def untracked = run(baritoneDir, true, ['git', 'ls-files', '--others', '--exclude-standard', '-z'])
    if (untracked.code != 0) throw new GradleException("Cannot inspect Baritone files: ${untracked.out}")
    def digest = MessageDigest.getInstance('SHA-256')
    digest.update(head.out.bytes)
    digest.update(tracked.out.bytes)
    untracked.out.split('\\x00').findAll { path ->
        def parts = path.tokenize('/')
        !parts.any { it in ['build', 'dist', '.gradle', 'logs', 'out', 'run'] } &&
                (parts.contains('src') || parts.contains('buildSrc') || path.startsWith('gradle/') ||
                path.endsWith('.gradle') || path.endsWith('.gradle.kts') ||
                path == 'gradle.properties' || path == 'gradlew' || path == 'gradlew.bat')
    }.sort().each { path ->
        def source = new File(baritoneDir, path)
        if (source.isFile()) {
            digest.update(path.getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(source.bytes)
        }
    }
    buildBaritone(digest.digest().encodeHex().toString())
}

// Give Loom a module artifact for jar-in-jar packaging, with coordinates that
// change whenever the source jar changes so remapping cannot reuse stale bytes.
def dependencyJar = new File(baritoneDist, "baritone-unoptimized-fabric-${project.baritone_version}.jar")
if (!dependencyJar.isFile()) {
    throw new GradleException("Baritone jar not found: ${dependencyJar}")
}
def artifactHash = MessageDigest.getInstance('SHA-256').digest(dependencyJar.bytes).encodeHex().toString().substring(0, 12)
ext.baritoneArtifactVersion = "${project.baritone_version}-${artifactHash}"
// Keep the staged dependency outside build/ so :clean cannot remove it during a build.
ext.baritoneArtifactDir = new File(rootDir, '.gradle/vibrato/baritone-dependency')
baritoneArtifactDir.mkdirs()
def artifactJar = new File(baritoneArtifactDir, "baritone-unoptimized-fabric-${baritoneArtifactVersion}.jar")
if (!artifactJar.isFile()) {
    java.nio.file.Files.copy(dependencyJar.toPath(), artifactJar.toPath())
}
